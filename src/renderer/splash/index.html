<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydro Desktop</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f0;
      --bg-soft: #edf5f7;
      --text: #202a39;
      --muted: #74808d;
      --line: #d3e4ea;
      --accent: #58c9ef;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1a1a1a;
      --bg-soft: #202936;
      --text: #edf4f6;
      --muted: #a4afb8;
      --line: #344552;
      --accent: #76d9f5;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      font-family: "Plus Jakarta Sans", "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 34%, color-mix(in srgb, var(--accent) 17%, transparent), transparent 34%),
        linear-gradient(140deg, var(--bg), var(--bg-soft));
      color: var(--text);
    }
    .splash { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 52px 52px 28px; }
    .mark-wrap { width: 86px; height: 86px; border-radius: 50%; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent), 0 12px 24px rgba(18, 37, 53, .16); animation: appear .32s ease-out both, breathe 2.2s ease-in-out infinite .32s; }
    .mark-wrap img { display: block; width: 100%; height: 100%; border-radius: inherit; }
    h1 { margin: 22px 0 8px; font-size: 31px; line-height: 1.15; font-weight: 650; letter-spacing: -.5px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: .1px; }
    .status { margin-top: auto; padding-top: 36px; text-align: center; }
    .status-title { display: block; font-size: 16px; font-weight: 540; }
    .status-detail { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; color: var(--muted); font-size: 13px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 1.4s ease-in-out infinite; }
    .progress { width: 224px; height: 2px; overflow: hidden; margin: 15px auto 0; border-radius: 99px; background: var(--line); }
    .progress::before { content: ""; display: block; width: 48%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: flow 1.65s ease-in-out infinite; }
    .version { align-self: flex-end; margin-top: auto; color: color-mix(in srgb, var(--muted) 75%, transparent); font-size: 11px; }
    @keyframes appear { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent), 0 12px 24px rgba(18, 37, 53, .16); } 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 8%, transparent), 0 14px 30px rgba(18, 37, 53, .19); } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes flow { from { transform: translateX(-120%); } to { transform: translateX(235%); } }
  </style>
</head>
<body>
  <main class="splash">
    <div class="mark-wrap"><img src="../../../assets/icon.png" alt="Hydro Desktop"></div>
    <h1>Hydro Desktop</h1>
    <p class="subtitle">智水工坊研发的 AI 个人桌面助手</p>
    <section class="status" aria-live="polite">
      <span class="status-title" id="status-title">正在准备智能工作台</span>
      <span class="status-detail"><i class="dot"></i><span id="status-detail">正在读取本地配置</span></span>
      <div class="progress"></div>
    </section>
    <span class="version" id="version"></span>
  </main>
  <script>
    const query = new URLSearchParams(location.search)
    document.documentElement.dataset.theme = query.get('theme') === 'dark' ? 'dark' : 'light'
    document.getElementById('version').textContent = `Hydro Desktop · v${query.get('version') || ''}`
    window.updateSplashStatus = ({ title, detail } = {}) => {
      if (title) document.getElementById('status-title').textContent = title
      if (detail) document.getElementById('status-detail').textContent = detail
    }
  </script>
</body>
</html>
